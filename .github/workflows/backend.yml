name: Backend MongoDB tests
on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'tools/**', '.github/workflows/backend.yml']
  push:
    branches: [develop, main, 'codex/mongodb-migration']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0.17
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test and package with real MongoDB
        working-directory: backend
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
        run: bash mvnw -B clean verify
      - name: Test offline H2 export conversion
        run: python3 -m unittest discover -s tools -p 'test_*.py'
