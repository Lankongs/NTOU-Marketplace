<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>個人頁面 - 我的商品管理</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./javascripts/topArea/initTop.js"></script>
    <script type="module" src="./javascripts/auth/member.js"></script>
    <script type="module" src="./javascripts/mainArea/selfPage.js"></script>
  </head>
  <body class="bg-light">
    <!-- 頂層欄位（參照 index.html 完整保留） -->
    <nav
      class="navbar navbar-expand-lg py-2"
      style="background-color: #d5eeff"
    >
      <div class="container-fluid">
        <div class="d-flex align-items-center gap-2">
          <!-- 主頁按鈕 -->
          <button type="button" id="to-home" class="btn" title="回首頁">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-house-door" viewBox="0 0 16 16">
              <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4z"/>
            </svg>
          </button>
          <!-- 搜尋表單 -->
          <div class="input-group py-2">
            <input type="text" class="form-control" placeholder="關鍵字" />
            <button class="btn btn-secondary" type="submit">送出</button>
          </div>

          <!-- 篩選按鈕（可搭配下拉選單或彈窗） -->
          <div class="dropdown">
            <button
              class="btn btn-outline-dark dropdown-toggle"
              type="button"
              id="filterDropdown"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              篩選
            </button>
            <ul class="dropdown-menu" aria-labelledby="filterDropdown">
              <li><a class="dropdown-item" href="#">依日期排序</a></li>
              <li><a class="dropdown-item" href="#">依熱門度</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="#">進階篩選...</a></li>
            </ul>
          </div>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
            <li class="nav-item">
              <button type="button" id="filter-button" class="btn">
                <img src="image/filter.png" alt="篩選" width="20" height="20" />
              </button>
            </li>
            <li class="nav-item">
              <button type="button" id="notify-button" class="btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-bell" viewBox="0 0 16 16">
                  <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"/>
                </svg>
              </button>
            </li>
            <li class="nav-item">
              <button type="button" id="shopping-cart-button" class="btn">
                <img
                  src="image/shopping-cart.png"
                  alt="購物車"
                  width="20"
                  height="20"
                />
                購物車
              </button>
            </li>
            <li class="nav-item">
              <button type="button" id="list-products-button" class="btn">
                <img
                  src="image/edit.png"
                  alt="刊登商品"
                  width="20"
                  height="20"
                />
                刊登商品
              </button>
            </li>
            <li>
              <button
                type="button"
                id="user-button"
                class="btn"
                aria-label="會員登入"
              >
                <img
                  src="image/account.png"
                  alt="使用者"
                  width="20"
                  height="20"
                />
                <span id="member-label">登入</span>
              </button>
            </li>
            <li>
              <button type="button" id="logout-button" class="btn" hidden>
                登出
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <p id="auth-message" role="alert" hidden></p>

    <!-- 個人頁面主佈局：側邊欄 + 右側商品管理 -->
    <div class="container-fluid py-4 px-md-5">
      <div class="row g-4">
        <!-- 左側側邊欄：個人資訊與商品篩選 -->
        <div class="col-12 col-md-3 col-lg-2">
          <div class="card shadow-sm border-0 mb-3 bg-white">
            <div class="card-body text-center p-3">
              <div class="mb-2">
                <i class="bi bi-person-circle display-5 text-primary"></i>
              </div>
              <h5 class="card-title mb-1 fw-bold">個人頁面</h5>
              <p class="text-muted small mb-0">管理您所上架的商品</p>
            </div>
          </div>

          <!-- 側邊欄篩選分類 -->
          <nav class="card shadow-sm border-0 self-sidebar bg-white">
            <div class="list-group list-group-flush py-2">
              <a
                href="#"
                class="list-group-item list-group-item-action border-0 nav-link active fw-bold bg-primary text-white rounded-2 mx-2 mb-1"
                data-filter="全部商品"
              >
                <i class="bi bi-grid-fill me-2"></i>全部商品
              </a>
              <a
                href="#"
                class="list-group-item list-group-item-action border-0 nav-link rounded-2 mx-2 mb-1"
                data-filter="販售中"
              >
                <i class="bi bi-check-circle me-2 text-success"></i>販售中
              </a>
              <a
                href="#"
                class="list-group-item list-group-item-action border-0 nav-link rounded-2 mx-2 mb-1"
                data-filter="已下架"
              >
                <i class="bi bi-pause-circle me-2 text-secondary"></i>已下架
              </a>
              <a
                href="#"
                class="list-group-item list-group-item-action border-0 nav-link rounded-2 mx-2 mb-1"
                data-filter="直購商品"
              >
                <i class="bi bi-tag me-2 text-primary"></i>直購商品
              </a>
              <a
                href="#"
                class="list-group-item list-group-item-action border-0 nav-link rounded-2 mx-2 mb-1"
                data-filter="競標商品"
              >
                <i class="bi bi-hammer me-2 text-danger"></i>競標商品
              </a>
            </div>
          </nav>
        </div>

        <!-- 右側主要內容區：商品卡片展示與操作 -->
        <div class="col-12 col-md-9 col-lg-10">
          <div class="card shadow-sm border-0 bg-white p-4">
            <!-- 頂部標題與快速操作 -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom flex-wrap gap-2">
              <div class="d-flex align-items-center gap-2">
                <h3 id="filter-title" class="fw-bold mb-0">全部商品</h3>
                <span id="product-count-badge" class="badge bg-secondary-subtle text-secondary-emphasis fs-6">0 件</span>
              </div>
            </div>

            <!-- 無商品時的引導提示 -->
            <div id="self-empty-state" class="alert alert-light text-center py-5 border" hidden>
              <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
              <h5 class="text-secondary fw-semibold">此分類下尚無商品</h5>
              <p class="text-muted small mb-3">您可以點擊下方按鈕刊登新商品。</p>
              <a href="./addProducts.html" class="btn btn-outline-primary btn-sm">
                前往刊登商品
              </a>
            </div>

            <!-- 商品管理卡片容器 -->
            <div
              id="self-cards-area"
              class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 編輯商品 Modal 彈窗 -->
    <div
      class="modal fade"
      id="editProductModal"
      tabindex="-1"
      aria-labelledby="editProductModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="editProductModalLabel">
              <i class="bi bi-pencil-square me-2 text-primary"></i>編輯商品資訊
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="edit-product-form">
            <div class="modal-body">
              <input type="hidden" id="edit-prod-id" />

              <div class="mb-3">
                <label for="edit-prod-name" class="form-label fw-semibold">
                  商品名稱 <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="edit-prod-name"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="prod-image" class="form-label fw-semibold">更改照片</label>
                <input type="file" class="form-control" id="edit-prod-image" accept="image/*">
              </div>

              <div class="mb-3">
                <label
                  for="edit-prod-price"
                  class="form-label fw-semibold"
                  id="edit-prod-price-label"
                >
                  價格 (NT$) <span class="text-danger">*</span>
                </label>
                <input
                  type="number"
                  class="form-control"
                  id="edit-prod-price"
                  min="0"
                  required
                />
              </div>

              <div class="mb-3" id="edit-prod-quantity-container">
                <label
                  for="edit-prod-quantity"
                  class="form-label fw-semibold"
                >
                  庫存數量 <span class="text-danger">*</span>
                </label>
                <input
                  type="number"
                  class="form-control"
                  id="edit-prod-quantity"
                  min="1"
                  value="1"
                />
              </div>

              <div class="mb-3">
                <label for="edit-prod-shipping" class="form-label fw-semibold">
                  運送方式 <span class="text-danger">*</span>
                </label>
                <select class="form-select" id="edit-prod-shipping" required>
                  <option value="校內面交">校內面交</option>
                  <option value="超商取貨 (7-11 / 全家)">超商取貨 (7-11 / 全家)</option>
                  <option value="郵寄包裹">郵寄包裹</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="edit-prod-desc" class="form-label fw-semibold">
                  商品描述
                </label>
                <textarea
                  class="form-control"
                  id="edit-prod-desc"
                  rows="3"
                  placeholder="請輸入商品介紹"
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                取消
              </button>
              <button type="submit" class="btn btn-primary px-4">
                儲存變更
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
