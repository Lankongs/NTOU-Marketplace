<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>確認結帳 - 海大校園交易平台</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="checkout.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./javascripts/topArea/initTop.js"></script>
    <script type="module" src="./javascripts/auth/member.js"></script>
    <script type="module" src="./javascripts/mainArea/checkout.js"></script>
  </head>
  <body class="bg-light">
    <nav
      class="navbar navbar-expand-lg py-2"
      style="background-color: #d5eeff"
    >
      <div class="container-fluid">
        <div class="d-flex align-items-center gap-2">
          <!-- 主頁按鈕 -->
           <button type="button" id="to-home" class="btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-house-door" viewBox="0 0 16 16">
              <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4z"/>
            </svg>
           </button>
          <!-- 搜尋表單 -->
          <div class="input-group py-2">
            <input type="text" class="form-control" placeholder="關鍵字" />
            <button class="btn btn-secondary" type="submit">送出</button>
          </div>

          <!-- 篩選按鈕（可搭配下拉選單或彈窗） -->
          <div class="dropdown">
            <button
              class="btn btn-outline-dark dropdown-toggle"
              type="button"
              id="filterDropdown"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              篩選
            </button>
            <ul class="dropdown-menu" aria-labelledby="filterDropdown">
              <li><a class="dropdown-item" href="#">依日期排序</a></li>
              <li><a class="dropdown-item" href="#">依熱門度</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="#">進階篩選...</a></li>
            </ul>
          </div>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
            <li class="nav-item">
              <button type="button" id="filter-button" class="btn">
                <img src="image/filter.png" alt="篩選" width="20" height="20" />
              </button>
            </li>
            <li class="nav-item">
              <button type="button" id="notify-button" class="btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-bell" viewBox="0 0 16 16">
                  <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"/>
                </svg>
              </button>
            </li>
            <li class="nav-item">
              <button type="button" id="shopping-cart-button" class="btn">
                <img
                  src="image/shopping-cart.png"
                  alt="購物車"
                  width="20"
                  height="20"
                />
                購物車
              </button>
            </li>
            <li class="nav-item">
              <button type="button" id="list-products-button" class="btn">
                <img
                  src="image/edit.png"
                  alt="刊登商品"
                  width="20"
                  height="20"
                />
                刊登商品
              </button>
            </li>
            <li>
              <button
                type="button"
                id="user-button"
                class="btn"
                aria-label="會員登入"
              >
                <img
                  src="image/account.png"
                  alt="使用者"
                  width="20"
                  height="20"
                />
                <span id="member-label">登入</span>
              </button>
            </li>
            <li>
              <button type="button" id="logout-button" class="btn" hidden>
                登出
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <p id="auth-message" role="alert" hidden></p>

    <main class="container-fluid px-3 px-md-5 py-4 checkout-page">
      <div class="d-flex justify-content-between align-items-center gap-3 mb-4 flex-wrap">
        <h1 class="h3 fw-bold mb-0">確認結帳</h1>
        <button type="button" id="checkout-back" class="btn btn-outline-secondary">返回購物車</button>
      </div>
      <div id="checkout-notice" class="alert alert-info" role="status" hidden></div>
      <div class="row g-4 align-items-start">
        <section class="col-12 col-lg-8" aria-label="各賣家結帳資料">
          <div id="checkout-sellers"></div>
        </section>
        <aside class="col-12 col-lg-4" aria-label="結帳摘要">
          <div class="card shadow-sm border-0 checkout-summary">
            <div class="card-body p-4">
              <h2 class="h5 fw-bold mb-3">訂單摘要</h2>
              <div id="checkout-summary-lines"></div>
              <hr />
              <div class="d-flex justify-content-between mb-2"><span>商品小計</span><strong id="checkout-subtotal">—</strong></div>
              <div class="d-flex justify-content-between mb-2"><span>總運費</span><strong id="checkout-shipping-fee">—</strong></div>
              <hr />
              <div class="d-flex justify-content-between align-items-center mb-4"><strong>應付總額</strong><strong class="fs-4 text-primary" id="checkout-total">—</strong></div>
              <button type="button" id="checkout-submit" class="btn btn-primary w-100 py-2" disabled>確認訂單（前端預覽）</button>
              <p class="text-muted small mt-2 mb-0">目前僅驗證與預覽結帳資訊，不會建立真實訂單或扣庫存。</p>
            </div>
          </div>
        </aside>
      </div>
    </main>
    <!-- 訂單確認視窗：前端展示，不送出到伺服器 -->
    <div class="modal fade" id="checkoutConfirmModal" tabindex="-1" aria-labelledby="checkoutConfirmTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header"><h2 class="modal-title fs-5" id="checkoutConfirmTitle">請確認結帳資訊</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button></div>
          <div class="modal-body"><div id="checkout-confirm-details"></div><p class="small text-muted mt-3 mb-0">目前為前端測試，不會建立訂單、扣除庫存或移除購物車商品。</p></div>
          <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">返回修改</button><button type="button" id="checkout-preview-confirm" class="btn btn-primary">確認預覽</button></div>
        </div>
      </div>
    </div>
  </body>
</html>
