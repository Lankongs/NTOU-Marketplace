<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首頁</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./javascripts/mainArea/cardsList.js"></script>
    <script type="module" src="./javascripts/topArea/listProducts.js"></script>
  </head>
  <body>
    <!--頂層欄位-->
    <div>
      <div>
        <input type="text" placeholder="關鍵字" required />
        <button type="submit">送出</button>
      </div>
      <div>
        <ul>
          <li>
            <button type="button" id="filter-button" class="btn">
              <img src="image/filter.png" alt="篩選" width="20" height="20" />
            </button>
          </li>
          <li>
            <button type="button" id="notify-button" class="btn">
              <img src="image/bell.png" alt="通知" width="20" height="20" />
            </button>
          </li>
          <li>
            <button type="button" id="shopping-cart-button" class="btn">
              <img
                src="image/shopping-cart.png"
                alt="購物車"
                width="20"
                height="20"
              />
              購物車
            </button>
          </li>
          <li>
            <button type="button" id="list-products-button" class="btn">
              <img src="image/edit.png" alt="刊登商品" width="20" height="20" />
              刊登商品
            </button>
          </li>
          <li>
            <button type="button" id="user-button" class="btn">
              <img
                src="image/account.png"
                alt="使用者"
                width="20"
                height="20"
              />
            </button>
          </li>
        </ul>
      </div>
    </div>

    <!--主頁內容-->
    <!--預想中這裡只放側邊的分類跟商品卡，供參-->
    <div id="main-area">
      <div class="container_left">
        <nav class="sidebar">
          <p>推薦</p>
          <ul>
            <li><a href="#">娛樂</a></li>
            <li><a href="#">運動</a></li>
            <li><a href="#">服飾</a></li>
            <li><a href="#">彩妝</a></li>
            <li><a href="#">電子</a></li>
          </ul>
        </nav>
      </div>
      <div id="cards-lists-area"></div>
    </div>
  </body>
</html>
